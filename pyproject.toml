[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradefabe"
version = "0.1.0"
description = "Doctrine-governed strategy lab and paper-trading engine (paper only, no live trading)"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "yfinance",
    "matplotlib",
    "streamlit",
    "requests",
    "lxml",
    "plotly",
]

[project.optional-dependencies]
desktop = ["pywebview"]
dev = ["pytest"]

[project.scripts]
tradefabe = "tradefabe.cli:main"
tradefabe-app = "tradefabe.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
