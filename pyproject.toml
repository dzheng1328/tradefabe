[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradefabe"
version = "0.1.0"
description = "Doctrine-governed strategy lab and paper-trading engine (paper only, no live trading)"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "yfinance",
    "matplotlib",
    "streamlit",
    "requests",
    "lxml",
    "plotly",
]

[project.optional-dependencies]
desktop = ["pywebview"]
dev = ["pytest", "pytest-xdist"]

[project.scripts]
tradefabe = "tradefabe.cli:main"
tradefabe-app = "tradefabe.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "." so `import harness` (repo-root script) resolves; "research" so factory_run.py's
# own `from piggyback_backtest import ...` (a sibling repo-root-script-style import,
# not a package) resolves the same way it does when run directly as a script.
pythonpath = [".", "research"]

# Parallel by default: the suite is run constantly and test_factory_run.py alone was
# ~50s of a 55s serial run. Measured 54.4s -> 13s on 14 cores, stable across repeats.
# Pass `-n0` to disable when you need readable tracebacks, --pdb, or -x.
addopts = ["-n", "auto"]
