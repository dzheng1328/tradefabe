[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradefabe"
version = "0.1.0"
description = "Doctrine-governed strategy lab and paper-trading engine (paper only, no live trading)"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "yfinance",
    "matplotlib",
    "streamlit",
    "requests",
    "lxml",
    "plotly",
]

[project.optional-dependencies]
desktop = ["pywebview"]
dev = ["pytest", "pytest-xdist"]
# Family M (#105). Kept OPTIONAL and lazily imported: torch is ~110MB plus ~400MB of
# weights, and the paper engine must keep running without any of it. Mirrors upstream
# Kronos's requirements.txt, with floors rather than their exact pins so this does not
# fight the rest of the environment. The model CODE is vendored (src/tradefabe/vendor/),
# so nothing here reaches for a git clone.
kronos = ["torch>=2.0", "einops>=0.8", "huggingface_hub>=0.33", "safetensors>=0.6", "tqdm>=4.67"]
# Alpaca paper-trading broker (#5). Optional and lazily imported, same reasoning as
# kronos above: the paper engine must keep running with no [alpaca] extra installed.
alpaca = ["alpaca-py>=0.33", "python-dotenv>=1.0"]

[project.scripts]
tradefabe = "tradefabe.cli:main"
tradefabe-app = "tradefabe.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

# MIT requires the copyright notice travel with the code, so the vendored LICENSE has to be
# installed alongside it, not just sit in the repo.
[tool.setuptools.package-data]
"tradefabe.vendor.kronos_model" = ["LICENSE"]

[tool.pytest.ini_options]
# "." so `import harness` (repo-root script) resolves; "research" so factory_run.py's
# own `from piggyback_backtest import ...` (a sibling repo-root-script-style import,
# not a package) resolves the same way it does when run directly as a script.
pythonpath = [".", "research"]

# Parallel by default: the suite is run constantly. Pass `-n0` to disable when you need
# readable tracebacks, --pdb, or -x.
#
# `worksteal` rather than xdist's default `load`: CI gets only 2 workers and the static
# split handed one of them 187 tests and the other 98, so the long pole decided the run.
# worksteal reassigns queued tests when a worker runs dry, which matters most exactly
# where cores are scarce.
addopts = ["-n", "auto", "--dist", "worksteal"]
