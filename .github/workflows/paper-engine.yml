name: paper engine

# Runs the paper engine in the cloud instead of on Dave's laptop (#63). launchd's
# StartInterval does not fire while a Mac is asleep, so the local jobs left multi-hour
# holes in the ledger overnight.
#
# The cloud is now the SOLE OWNER of state/. The local launchd jobs must stay disabled --
# two writers would fork the ledger. `git pull` before reading the dashboard locally.
#
# No secrets: everything here is paper, against public APIs (yfinance, Hyperliquid).

on:
  schedule:
    # UTC. ET equivalents drift an hour with DST; harmless, and the two daily jobs
    # shift together so factory still lands before the rebalance.
    #
    # NEITHER daily cron may land ON THE HOUR (#152): "0 * * * *" already matches every
    # hour including :00, so a daily cron at "0 22 * * *" collides with it at 22:00 --
    # GitHub coalesces two schedule matches at the same minute into ONE triggered run,
    # and github.event.schedule then reports only the hourly cron, never the daily one.
    # The "pick cycle" step's case statement below matched on the exact daily string, so
    # it silently never fired: 55/55 scheduled runs from 2026-07-25 (this workflow's
    # creation) through 2026-07-31 resolved to "mark", including every one at ~22:0X UTC.
    # The single real "run" cycle in that entire window was a manual workflow_dispatch,
    # not the schedule. Every off-the-hour offset here is deliberate, not arbitrary.
    - cron: "0 * * * *"      # mark, hourly
    - cron: "7 22 * * *"     # daily rebalance (18:00 EDT + 7min, clear of the hourly mark)
    # FACTORY CYCLE PAUSED 2026-07-27 (#98). Was: - cron: "0 21 * * *" -- if this is ever
    # restored, use "6 21 * * *" (off-the-hour), NOT the original "0 21 * * *": that
    # value would silently reintroduce the exact #152 collision documented above.
    #
    # Not deleted, and not because the code is wrong -- the factory works exactly as
    # designed. It is paused because the DESIGN has no exit condition: it promotes its
    # best-DSR candidate regardless of verdict, and a DEAD promotion is monitor-only
    # forever under v1.2, so finding something and finding nothing produce the same
    # outcome (another monitor-only book). Meanwhile every draw it logs raises
    # family_n_tested() for every future candidate: 124 draws, 0 survivors, required
    # Sharpe 1.58 -> 2.52, heading for 3.63 within a year. Real equity edges are 0.5-1.5.
    #
    # Un-pause once the ledger-segregation question in RUNDOWN.md is decided and
    # PRE-REGISTERED. Until then a manual burst is still available:
    #     gh workflow run "paper engine" -f job=factory
    # workflow_dispatch is deliberately left intact so this is a pause, not a removal.
  workflow_dispatch:
    inputs:
      job:
        description: "which cycle to run"
        required: true
        default: mark
        type: choice
        options: [mark, run, factory]

permissions:
  contents: write

# Never let two cycles write state at once. Queue rather than cancel: a mark that gets
# cancelled mid-write would leave a partial ledger.
concurrency:
  group: paper-engine
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: pick cycle
        id: pick
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            workflow_dispatch:*) CYCLE="${{ inputs.job }}" ;;
            *"6 21 * * *")      CYCLE=factory ;;
            *"7 22 * * *")      CYCLE=run ;;
            *)                   CYCLE=mark ;;
          esac
          echo "cycle=$CYCLE" >> "$GITHUB_OUTPUT"
          echo "running: $CYCLE"

      - name: install
        run: pip install -e .

      # Family M (#105) needs torch + a ~400MB checkpoint, and ONLY the daily `run` cycle
      # rebalances those books -- they are freq D, so `mark` has nothing to forecast. The
      # hourly job therefore stays as cheap as it was: installing torch on ~12 marks a day
      # would have cost more Actions minutes than the whole rest of the engine.
      #
      # CPU wheel explicitly: the default index pulls the CUDA build (~2.5GB of nvidia-*
      # wheels) onto a runner with no GPU. The +cpu wheel is ~200MB.
      #
      # If this step fails the cycle STILL RUNS -- kronos_live.run_kronos() checks
      # kronos.is_available() and skips the three books, touching no ledger. A torch
      # packaging problem must not cost a day of marks on 18 other books.
      - name: install kronos extra (daily run only)
        if: steps.pick.outputs.cycle == 'run'
        continue-on-error: true
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[kronos]"
          python -c "from tradefabe import kronos; assert kronos.is_available()"

      # Cache the HuggingFace checkpoint across cycles: ~400MB re-downloaded every day
      # otherwise. Keyed on the pinned repo names, so changing the checkpoint invalidates it.
      - name: cache Kronos weights
        if: steps.pick.outputs.cycle == 'run'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-base-v1

      - name: run cycle
        run: |
          case "${{ steps.pick.outputs.cycle }}" in
            factory) PYTHONPATH="$PWD/src:$PWD:$PWD/research" python research/factory_run.py --n 20 ;;
            run)     tradefabe run ;;
            *)       tradefabe mark ;;
          esac

      - name: commit ledger
        run: |
          git config user.name  "tradefabe-bot"
          git config user.email "davezheng1328@gmail.com"
          git add -A state artifacts graveyard.csv generated_templates.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no ledger change"; exit 0
          fi
          git commit -qm "paper engine: ${{ steps.pick.outputs.cycle }} $(date -u +%Y-%m-%dT%H:%M)Z [skip ci]"
          # another cycle may have pushed while this one ran; rebase and retry rather
          # than fail, since losing a cycle's marks is worse than a slow push.
          # push back to whatever ref this ran on: main for scheduled cycles, the
          # feature branch for a dispatch test. Hardcoding main would let a test run on a
          # branch shove that branch's state onto main.
          BR="${{ github.ref_name }}"
          for i in 1 2 3; do
            git pull --rebase --quiet origin "$BR" && git push --quiet origin "HEAD:$BR" && exit 0
            echo "push attempt $i failed, retrying"; sleep 5
          done
          exit 1
