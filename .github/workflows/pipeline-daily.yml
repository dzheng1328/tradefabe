name: pipeline daily

# The research pipeline's daily cycle (#174): screen (#175) whatever's pending in
# PIPELINE_LEDGER, automatically on a pass pre-register (#179), then OOS-test every
# pending pre-registered candidate and promote on ALIVE, capped (#180) -- scheduled
# durably via GitHub Actions instead of a live Claude Code session -- same reasoning as
# cost-check.yml (#155): Claude's own CronCreate scheduler is session-local and
# silently vanishes on compaction. This can't, and it runs even while the machine is
# asleep.
#
# PROPOSAL ITSELF IS NOT THIS WORKFLOW'S JOB as of 2026-08-04. It used to be: a single
# LLM-driven step calling research/pipeline_ideas.py's propose_idea() (a $0.05/day-
# capped, closed-book Haiku call), needing ANTHROPIC_API_KEY as a repo secret. Dave's
# explicit call: that's retired, superseded by a scheduled Claude Code Routine (real
# research, real web-search tool use, running under his Pro subscription, not a
# separate paid API key) that writes PIPELINE_LEDGER (pipeline_ideas.csv) directly.
# This workflow no longer needs ANTHROPIC_API_KEY or the `[pipeline]` extra at all --
# everything it does now is deterministic Python, same as paper-engine.yml.
#
# Pre-registration (#179) is FULLY AUTOMATIC -- Dave's explicit call, 2026-08-01: a
# candidate that clears the prelim screen is committed to STRATEGIES.md the same run,
# no PR, no human checkpoint. See DOCTRINE v1.11 for the tradeoff this trades away
# (pre-registration as real judgment vs. a genuinely hands-off daily pipeline) recorded
# honestly rather than glossed over.
#
# The OOS test (#180) runs the SAME doctrine gate every other family goes through,
# against the pipeline's own segregated n_tested bucket -- no lighter bar for arriving
# via an automatic checkpoint. Promotion is capped at its own pool (10, Dave's explicit
# call 2026-08-04, separate from the factory's MAX_FACTORY_PROMOTED=20). A DEAD verdict
# is terminal: logged to graveyard.csv, never promoted "anyway" (the factory's own
# original #98 mistake).

on:
  schedule:
    - cron: "42 14 * * *"    # ~10:42am ET daily (drifts an hour with DST, same accepted
                              # tradeoff every other cron in this repo makes) -- an
                              # off-hour offset, avoiding paper-engine.yml's mark/run/
                              # factory slots and cost-check.yml's Monday slot (#152's
                              # collision class: never land exactly on another cron's minute)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pipeline_daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: pip install -e .

      - name: run daily cycle (screen pending, pre-register on a pass, OOS-test pending)
        run: PYTHONPATH="$PWD:$PWD/src:$PWD/research" python research/pipeline_daily.py

      - name: commit ledgers
        run: |
          git config user.name  "tradefabe-bot"
          git config user.email "davezheng1328@gmail.com"
          git add pipeline_ideas.csv artifacts/prelim_log.csv STRATEGIES.md \
                 pipeline_preregistered.csv graveyard.csv
          git add -A state artifacts 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing happened today"; exit 0
          fi
          git commit -qm "pipeline daily: $(date -u +%Y-%m-%dT%H:%M)Z [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push --quiet origin HEAD:main && exit 0
            echo "push attempt $i failed, retrying"; sleep 5
          done
          exit 1
