name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: no iCloud conflict duplicates
        # A committed "<name> 2.<ext>" copy of a workflow made GitHub run the paper
        # engine twice on every schedule. Cheap to check, expensive to miss. Extension
        # optional: a symlink like ".venv 3" is the same iCloud pattern with no "."ext.
        run: |
          DUPES=$(git ls-files | grep -E ' [0-9]+(\.[A-Za-z0-9]+)?$' || true)
          if [ -n "$DUPES" ]; then
            echo "::error::iCloud conflict duplicates are tracked:"; echo "$DUPES"
            exit 1
          fi
          echo "no duplicates tracked"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # pandas/numpy/streamlit/pyarrow from scratch was ~30s of a 37s Install step,
          # on every run. pyproject.toml is the cache key, so a dependency change busts it.
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,api]"
      - name: Run tests
        # not -v: 285 lines of PASSED is noise, and the failure output is unchanged.
        run: pytest
