name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: no iCloud conflict duplicates
        # A committed "<name> 2.<ext>" copy of a workflow made GitHub run the paper
        # engine twice on every schedule. Cheap to check, expensive to miss. Extension
        # optional: a symlink like ".venv 3" is the same iCloud pattern with no "."ext.
        run: |
          DUPES=$(git ls-files | grep -E ' [0-9]+(\.[A-Za-z0-9]+)?$' || true)
          if [ -n "$DUPES" ]; then
            echo "::error::iCloud conflict duplicates are tracked:"; echo "$DUPES"
            exit 1
          fi
          echo "no duplicates tracked"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # pandas/numpy/pyarrow from scratch was ~30s of a 37s Install step,
          # on every run. pyproject.toml is the cache key, so a dependency change busts it.
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,api]"
      - name: Run tests
        # not -v: 285 lines of PASSED is noise, and the failure output is unchanged.
        run: pytest

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # NOT 20: jsdom 30 (and its undici dependency) require Node
          # ^22.22.2 || ^24.15.0 || >=26.0.0 -- 20 fails to even import jsdom. 22 is
          # also the floor for the `test` script's --no-experimental-webstorage flag
          # (Node's own experimental global localStorage shadows jsdom's real one
          # without it; the flag itself doesn't exist before Node 22, confirmed
          # against a real Node 20 and Node 22 binary before picking this version).
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        # ops/build_app.sh's packaged desktop app now serves this output directly
        # (api/main.py mounts frontend/dist/ when present) rather than spawning a
        # live `npm run dev` -- a broken production build must fail here, not
        # silently on Dave's machine at package time.
        run: npm run build
